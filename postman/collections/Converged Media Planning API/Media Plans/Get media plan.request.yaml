$kind: http-request
description: Returns a media plan and its current planning status.
url: ://{{baseUrl}}/v1/media-plans/?planId=plan_45678
method: GET
headers:
  x-mock-response-code: "200"
queryParams:
  planId: plan_45678
body:
  type: text
  content: ""
scripts:
  - type: afterResponse
    code: |-
      // Happy-path tests for GET /v1/media-plans
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      const json = pm.response.json();
      const plan = json.data;

      pm.test("Response id equals planId", function () {
          pm.expect(plan.id).to.eql("plan_45678");
      });

      pm.test("Response contains media plan name", function () {
          pm.expect(plan.name).to.be.a("string").and.not.empty;
      });

      pm.test("Response planningStatus is APPROVED", function () {
          pm.expect(plan.planningStatus).to.eql("APPROVED");
      });

      pm.test("Response totalBudget is present", function () {
          pm.expect(plan.totalBudget).to.be.a("number");
      });
    language: text/javascript
examples: ./.resources/Get media plan.resources/examples
order: 1000
