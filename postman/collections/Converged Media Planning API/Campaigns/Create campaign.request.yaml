$kind: http-request
description: Creates a new media campaign for an advertiser.
url: "{{baseUrl}}/v1/campaigns"
method: POST
headers:
  - key: Content-Type
    value: application/json
    description: ""
  - key: x-mock-response-code
    value: "201"
    description: ""
    $type: integer
body:
  type: json
  content: |-
    {
      "advertiserId": "adv_12345",
      "name": "Fall Launch",
      "budget": 150000
    }
  $type: |-
    {
      "type": "object",
      "properties": {
        "advertiserId": {
          "type": "string"
        },
        "name": {
          "type": "string"
        },
        "budget": {
          "type": "integer"
        }
      }
    }
scripts:
  - type: afterResponse
    code: |-
      // Happy-path tests for POST /v1/campaigns
      pm.test("Status code is 201", function () {
          pm.response.to.have.status(201);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      const json = pm.response.json();
      const campaign = json.data;

      pm.test("Response contains campaign id", function () {
          pm.expect(campaign.id).to.be.a("string").and.not.empty;
      });

      pm.test("Response name matches request", function () {
          pm.expect(campaign.name).to.eql("Fall Launch");
      });

      pm.test("Response budget matches request", function () {
          pm.expect(campaign.budget).to.eql(150000);
      });

      pm.test("Response status is DRAFT", function () {
          pm.expect(campaign.status).to.eql("DRAFT");
      });
    language: text/javascript
examples: ./.resources/Create campaign.resources/examples
order: 2000
