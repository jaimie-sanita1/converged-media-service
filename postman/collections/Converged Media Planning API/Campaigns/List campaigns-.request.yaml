$kind: http-request
name: List campaigns.
description: Returns campaigns for an advertiser, optionally filtered by campaign status.
url: "{{baseUrl}}/v1/campaigns?advertiserId=adv_12345&status=ACTIVE"
method: GET
queryParams:
  advertiserId: adv_12345
  status: ACTIVE
examples: ./.resources/List campaigns-.resources/examples
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Happy-path tests for GET /v1/campaigns
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is JSON", function () {
          pm.response.to.be.json;
      });

      const json = pm.response.json();

      pm.test("data is an array", function () {
          pm.expect(json.data).to.be.an("array");
      });

      pm.test("meta.total is present", function () {
          pm.expect(json).to.have.nested.property("meta.total");
          pm.expect(json.meta.total).to.be.a("number");
      });

      pm.test("Each item matches advertiserId and ACTIVE status", function () {
          if (json.data.length > 0) {
              json.data.forEach(function (item) {
                  pm.expect(item.advertiserId, "advertiserId mismatch").to.eql("adv_12345");
                  pm.expect(item.status, "status should be ACTIVE").to.eql("ACTIVE");
              });
          }
      });
