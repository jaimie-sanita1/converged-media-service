$kind: http-request
url: "{{baseUrl}}/api/cart"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
          pm.response.to.have.status(200);
      });

      pm.test('Cart response has totals', function () {
          const json = pm.response.json();
          pm.expect(json.cart).to.have.property('items');
          pm.expect(json.cart).to.have.property('total');
          pm.expect(json.cart).to.have.property('itemCount');
      });
    language: text/javascript
order: 2000
