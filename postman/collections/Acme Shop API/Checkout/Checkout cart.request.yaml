$kind: http-request
url: "{{baseUrl}}/api/checkout"
method: POST
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', function () {
          pm.response.to.have.status(201);
      });

      pm.test('Order is confirmed', function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property('order');
          pm.expect(json.order).to.have.property('id');
          pm.expect(json.order.status).to.eql('confirmed');
      });
    language: text/javascript
order: 1000
