$kind: http-request
url: "{{baseUrl}}/api/products/{{productId}}"
method: GET
scripts:
  - type: afterResponse
    code: >-
      pm.test('Status is 200', function () {
          pm.response.to.have.status(200);
      });


      pm.test('Response includes product object', function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property('product');
          pm.expect(json.product).to.have.property('id', pm.environment.get('productId'));
          pm.expect(json.product).to.have.property('name');
          pm.expect(json.product).to.have.property('price');
      });
    language: text/javascript
order: 2000
