apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: js-converged-media-service-ingress
  namespace: js-converged-media-service
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:us-east-2:005904641462:certificate/9e5d08a4-6904-4c82-85f7-5d45284ab27c
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80, "HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
spec:
  rules:
    - host: js-converged-media-service.postmansolutions.com
      http:
        paths:
          - backend:
              service:
                name: js-converged-media-service
                port:
                  number: 80
            pathType: ImplementationSpecific
  tls:
    - hosts:
        - js-converged-media-service.postmansolutions.com
