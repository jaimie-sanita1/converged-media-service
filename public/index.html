<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme Shop</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>Acme Shop</h1>
      <nav>
        <a href="/" data-view="catalog">Catalog</a>
        <a href="#cart" data-view="cart">Cart (<span id="cart-count">0</span>)</a>
      </nav>
    </header>

    <main>
      <section id="catalog-view" class="view">
        <h2>Products</h2>
        <div id="product-list" class="product-list"></div>
      </section>

      <section id="cart-view" class="view hidden">
        <h2>Your Cart</h2>
        <div id="cart-items"></div>
        <p class="cart-total">Total: $<span id="cart-total">0.00</span></p>
        <button id="checkout-btn" type="button" disabled>Checkout</button>
      </section>

      <section id="confirmation-view" class="view hidden">
        <h2>Order Confirmation</h2>
        <p id="confirmation-message"></p>
        <dl id="order-details" class="order-details"></dl>
        <button id="shop-again-btn" type="button">Shop Again</button>
      </section>
    </main>

    <div id="toast" class="toast hidden" role="status"></div>
    <p id="demo-mode-badge" class="demo-badge"></p>

    <script src="/js/app.js"></script>
  </body>
</html>
