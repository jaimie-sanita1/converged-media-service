name: Automated API tests using Postman CLI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  automated-api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Start converged-media-service
        run: npm run build && npm start &
      - name: Wait for service to be ready
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/healthz && break
            echo "Waiting for service... ($i)"
            sleep 2
          done
      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/unix.sh" | sh
      - name: Login to Postman CLI
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}
      - name: Run API tests
        run: |
          postman collection run "52538155-d5b68306-dd37-49f4-8367-a53f0914d802" -e "52538155-c52fa712-ad53-4a75-9c20-759d3e8bc23e" --report-events