name: Postman Governance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

env:
  POSTMAN_SPEC_ID: "" # Add generated Spec ID during demo
  POSTMAN_WORKSPACE_ID: "55bbacda-a0a0-410f-a473-c7f121e0c1a5"

jobs:
  lint-spec:
    name: Postman API Governance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Postman CLI
        if: env.POSTMAN_SPEC_ID != ''
        run: curl -o- "https://dl-cli.pstmn.io/install/unix.sh" | sh

      - name: Login to Postman
        if: env.POSTMAN_SPEC_ID != ''
        run: postman login --with-api-key ${{ secrets.POSTMAN_API_KEY }}

      - name: Lint spec
        if: env.POSTMAN_SPEC_ID != ''
        run: |
          postman spec lint "${{ env.POSTMAN_SPEC_ID }}" \
            --workspace-id "${{ env.POSTMAN_WORKSPACE_ID }}" \
            --report-events

      - name: Governance not configured
        if: env.POSTMAN_SPEC_ID == ''
        run: echo "No Postman specification configured yet. Skipping governance."